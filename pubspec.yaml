name: ishhub
description: IshHub — Local services marketplace for Uzbekistan
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  provider: ^6.1.2
  # Navigation
  go_router: ^14.0.0
  # Network
  dio: ^5.4.0
  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  # Maps & Location
  google_maps_flutter: ^2.8.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  # WebSocket
  web_socket_channel: ^3.0.0
  # Push Notifications
  firebase_core: ^3.5.0
  firebase_messaging: ^15.1.0
  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
