name: ishhub
description: IshHub — Local services marketplace for Uzbekistan
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3+1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Maps & location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Realtime
  web_socket_channel: ^3.0.1

  # Push
  firebase_core: ^3.5.0
  firebase_messaging: ^15.1.0

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  sentry_flutter: ^9.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
