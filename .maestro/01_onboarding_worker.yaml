appId: ${APP_ID}
name: 01 - OTP, Profile, Worker Setup
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to IshHub"
- tapOn: "Phone"
- eraseText
- inputText: ${WORKER_PHONE}
- tapOn: "Send code"
- assertVisible: "Verification code"
- tapOn: "• • • • • •"
- inputText: ${OTP_CODE}
- tapOn: "Verify"
- assertVisible: "Profile setup"
- tapOn: "Full name"
- inputText: "Maestro Worker"
- tapOn: "City"
- eraseText
- inputText: "Toshkent"
- tapOn: "District or neighborhood"
- inputText: "Yunusobod"
- hideKeyboard
- tapOn: "Continue"
- assertVisible:
    text: "Become a worker|I work as a worker"
- tapOn:
    text: "Become a worker|I work as a worker"
- assertVisible: "Worker setup"
- tapOn: "Search skills"
- inputText: "repair"
- tapOn: "Shoe repair"
- hideKeyboard
- swipe:
    direction: UP
- tapOn: "Bio"
- inputText: "Maestro E2E worker for repair and delivery jobs."
- tapOn: "Default rate (UZS)"
- inputText: "75000"
- hideKeyboard
- swipe:
    direction: UP
- tapOn: "Open worker profile"
- assertVisible: "Feed"